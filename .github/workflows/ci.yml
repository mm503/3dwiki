name: CI

on:
  push:
    branches:
      - main
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Install mkdocs dependencies
      run: pip install -r requirements.txt

    - name: Test wiki build - render pages
      run: mkdocs build --verbose --strict --clean

    - name: Deploy pages to branch rendered
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: mkdocs gh-deploy --clean --force
